  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;" />
    <title>Lumina</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1720;
        --bg2: #16232f;
        --teal: #1f6f63;
        --teal-light: #34b39c;
        --cream: #f6f4ee;
        --muted: #8ea0b0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, -apple-system, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        background:
          radial-gradient(120% 100% at 12% 0%, #1d3b3a 0%, transparent 55%),
          radial-gradient(90% 90% at 100% 100%, #24313f 0%, transparent 60%),
          linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
        color: var(--cream);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        position: relative;
      }
      .drag {
        position: absolute;
        inset: 0 0 auto 0;
        height: 44px;
        -webkit-app-region: drag;
      }
      .logo {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 10px 24px rgba(31, 111, 99, 0.55));
        animation: float 3.4s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      } }
      h1 {
        margin: 18px 0 4px;
        font-size: 25px;
        letter-spacing: 0.14em;
        font-weight: 600;
      }
      .tagline {
        margin: 0;
        font-size: 12.5px;
        letter-spacing: 0.22em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .bar {
        margin-top: 30px;
        width: 210px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
        position: relative;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--teal-light), transparent);
        animation: slide 1.35s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      .status {
        margin-top: 16px;
        height: 18px;
        font-size: 12.5px;
        color: var(--muted);
        transition: color 0.2s ease;
        max-width: 400px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status.error { color: #ff9c8a; }
      .status.busy { color: #b9c8d4; }
      .version {
        position: absolute;
        bottom: 12px;
        font-size: 10.5px;
        letter-spacing: 0.16em;
        color: rgba(142, 160, 176, 0.55);
      }
      body.done .bar::after { animation-duration: 0.7s; }
    </style>
  </head>
